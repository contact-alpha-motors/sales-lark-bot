services:
  sales-assistant:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sales-assistant-bot

    restart: unless-stopped

    environment:
      DATABASE_PATH: /app/data/assistant.db

      # Lark : une app par espace de travail, la 2e est optionnelle.
      LARK_APP_ID: ${LARK_APP_ID}
      LARK_APP_SECRET: ${LARK_APP_SECRET}
      LARK_APP_ID_2: ${LARK_APP_ID_2:-}
      LARK_APP_SECRET_2: ${LARK_APP_SECRET_2:-}

      # Modeles via OpenRouter.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      IA_MODELE_CONVERSATION: ${IA_MODELE_CONVERSATION:-google/gemini-2.5-flash-lite}
      IA_MODELE_RESUME: ${IA_MODELE_RESUME:-google/gemini-2.5-flash-lite}
      IA_MODELE_VISION: ${IA_MODELE_VISION:-google/gemini-2.5-flash}
      # Liste blanche budget : SEULS ces modeles peuvent etre appeles. Doit
      # contenir les 3 modeles ci-dessus, sinon le garde-fou refuse l'appel.
      IA_MODELES_AUTORISES: ${IA_MODELES_AUTORISES:-xiaomi/mimo-v2.5,z-ai/glm-4.7-flash,google/gemini-2.5-flash-lite}

      # Odoo PRODUCTION (app., jamais odooee : base fantome).
      ODOO_URL: ${ODOO_URL:-https://app.alphamotors-cameroun.com}
      ODOO_DB: ${ODOO_DB:-alpha_motors}
      ODOO_USER: ${ODOO_USER}
      ODOO_PASSWORD: ${ODOO_PASSWORD}

      # Open IDs autorises a ecrire dans Odoo (virgules). Vide = tout le
      # monde : acceptable en test, pas en production.
      LARK_ECRIVAINS: ${LARK_ECRIVAINS:-}

      TZ: Africa/Douala

    # Volumes nommes (et non des bind-mounts ./data) : l'utilisateur
    # Portainer non-admin qui deploie n'a pas le droit aux bind-mounts.
    volumes:
      - sales_data:/app/data
      - sales_downloads:/app/downloads
      - sales_exports:/app/exports

volumes:
  sales_data:
  sales_downloads:
  sales_exports:
